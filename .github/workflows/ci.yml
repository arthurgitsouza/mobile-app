# Verifica todo PR e todo push na main: instalação limpa, testes e lint (inclui formatação).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: npm test
        working-directory: server
